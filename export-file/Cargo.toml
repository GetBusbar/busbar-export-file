# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-export-file"
version = "1.6.0"
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The request-log FILE export sink (`module: request-log-file`): appends each request-log line as JSONL, rotating it at `rotate_mb` by rename and keeping 9 archives by default (`keep: 0` truncates in place, as 1.5.5 did). Every file act is performed by the host on the destination it opened for the operator's configured path; the sink never opens a path."
license.workspace = true

[lib]
# rlib: THE LOGIC and its door. A build that LINKS this crate registers `door` as its compiled-in
# row (no symbol is exported from here); the sibling `busbar-export-file-plugin` cdylib exports the
# same door as `busbar_plugin_door`. One source, both doors (THE DESIGN §11.4).
crate-type = ["rlib"]

[dependencies]
# The ONE busbar crate a plugin names (#40: contract only; DECISIONS #84 merged the plugin SDK into it
# as `busbar_contract::abi::sdk`, so a plugin's busbar closure is exactly busbar-contract). Pinned by
# git rev to the busbar commit in `.busbar-ref`; a busbar build that links this crate `[patch]`es the
# busbar git source to its own tree, so ONE copy of the contract links.
busbar-contract = { workspace = true }
# The sink's settings shape (`FileSettings`), parsed with the same serde the host's configuration
# grammar uses so a settings error reads exactly as it always has. Not a busbar crate: it does not
# widen this crate's busbar closure.
serde = { workspace = true }
# The sink's operator log lines, emitted with the catalogue's `diag` banner field exactly as they
# always were; the door's call capture carries them to the instance's plugin log (THE DESIGN §11.2).
tracing = { workspace = true }

[dev-dependencies]
# Builds the tests' settings and reads `declares.json`: tests only, so no shipped image carries it.
serde_json = { workspace = true }
# The contract's plugin test harness (fake host, door view, reply copies): dev-only, so no shipped image carries it.
busbar-contract = { workspace = true, features = ["test-seal"] }

[lints]
workspace = true
