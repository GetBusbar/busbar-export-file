# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-export-file-plugin"
version = "1.5.0"
publish = false            # first-party signed cdylib, shipped as a packed/signed tarball, not to crates.io
edition = "2021"
rust-version = "1.97"
description = "First-party signed kind:export plugin cdylib: the request-log FILE sink (`module: request-log-file`), packaged as a droppable busbar plugin. Drop the signed tarball into `plugins/` and name it from an `export.<name>.module: request-log-file` block."
license = "Apache-2.0"

[lib]
# cdylib: the DROPPED-IN door (a signed tarball in `plugins/`). rlib: REQUIRED for `cargo test` to
# emit the cdylib artifact the conformance test packs (a cdylib-only package builds a trivial test
# harness and never produces the .so/.dylib — the store-postgres-plugin / store-mysql-plugin note).
crate-type = ["cdylib", "rlib"]

[dependencies]
# THE LOGIC, same repo: its `door` is the door this image exports.
busbar-export-file = { path = "../export-file" }
# `export_door!`, the macro that emits the image's one symbol. Same pinned rev as the logic crate's.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "934a016e20fc1a67c209b671d137c8cc28092767" }

[dev-dependencies]
# The conformance test loads the built cdylib and the linked door over the REAL loader — dev-only,
# never in the shipped artifact. Same pinned rev, so one busbar source resolves.
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "934a016e20fc1a67c209b671d137c8cc28092767" }
